<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12101c" />
    <meta name="description" content="Catch, evolve and battle creatures up a three-floor roguelite climb." />
    <!-- Installable app: Android/desktop read the manifest; iOS reads the apple-* tags. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./favicon-64.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Creatures" />
    <title>Creature Roguelite</title>
    <style>
      /* Around the board (landscape, tablets): a soft glow and a faint dot grid instead of flat black. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: radial-gradient(#2a2340 1px, transparent 1.5px) 0 0 / 18px 18px, radial-gradient(ellipse at center, #221c36 0%, #12101c 75%) #12101c; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      /* Keep the game clear of the notch and home bar when installed fullscreen. */
      #game { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); right: env(safe-area-inset-right); }
      canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
